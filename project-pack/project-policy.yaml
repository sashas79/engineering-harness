autonomy:
  specification_normalisation: bounded
  architecture_derivation: supervised
  work_decomposition: bounded
  implementation: bounded
  production_release: human_only

human_control:
  specification_baseline: product_owner
  architecture_baseline: architect
  security_exception: security
  production_release: release_authority

architecture_change:
  api_change: architect
  schema_change: architect
  trust_boundary_change: architect_and_security

scope:
  default_write_access: deny
  task_declared_scope_required: true
