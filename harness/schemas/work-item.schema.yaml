$schema: "https://json-schema.org/draft/2020-12/schema"
title: Engineering Work Item
type: object
required:
  - id
  - title
  - objective
  - boundary
  - baseline
  - traceability
  - scope
  - verification
  - dependencies
  - human_gates
properties:
  id:
    type: string
    pattern: '^TASK-[0-9]{3,}$'
  title:
    type: string
    minLength: 1
  objective:
    type: string
    minLength: 1
  boundary:
    type: object
    required: [type, name]
    properties:
      type:
        enum: [bounded_context, integration_boundary, platform]
      name:
        type: string
  baseline:
    type: object
    required: [specification, architecture, work_policy]
    properties:
      specification: {type: string}
      architecture: {type: string}
      work_policy: {type: string}
  traceability:
    type: object
    required: [requirements, acceptance_criteria]
    properties:
      requirements:
        type: array
        items: {type: string}
        minItems: 1
      acceptance_criteria:
        type: array
        items: {type: string}
        minItems: 1
      architecture:
        type: array
        items: {type: string}
      contracts:
        type: array
        items: {type: string}
  scope:
    type: object
    required: [allowed, forbidden]
    properties:
      allowed:
        type: array
        items: {type: string}
        minItems: 1
      forbidden:
        type: array
        items: {type: string}
  verification:
    type: object
    required: [required]
    properties:
      required:
        type: array
        items: {type: string}
        minItems: 1
  dependencies:
    type: array
    items: {type: string}
  human_gates:
    type: object
    additionalProperties:
      type: string
additionalProperties: false
