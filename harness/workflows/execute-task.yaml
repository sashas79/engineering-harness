workflow:
  id: execute-engineering-work-item
  version: 0.1.0

preconditions:
  - work_baseline_approved
  - task_exists
  - dependencies_completed
  - task_baselines_current
  - human_prerequisites_satisfied

steps:
  - plan
  - build_context
  - execute
  - verify
  - review

on_verify_failure: rework
on_review_failure: rework
on_policy_conflict: escalate
on_baseline_mismatch: stop

outputs:
  - implementation_changes
  - work_state_update
  - evidence_bundle
  - telemetry_record
