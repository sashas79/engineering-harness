workflow:
  id: project-bootstrap
  version: 0.1.0

stages:
  - id: bootstrap_repository
    inputs:
      - project-pack/project.yaml
      - harness/templates/repository
      - harness/standards
    outputs:
      - project/**
    validations:
      - repository_structure_valid
      - engineering_baseline_installed

  - id: ingest_specification
    inputs:
      - project-pack/source/**
      - harness/schemas/specification.schema.yaml
    prompt: harness/prompts/specification-ingestor.md
    outputs:
      - project/spec/**
      - project/evidence/bootstrap/spec-ingestion/**

  - id: validate_specification
    validations:
      - schema_valid
      - source_traceability_complete
      - ambiguities_recorded
      - acceptance_criteria_linked
    human_gate: specification_baseline
    outputs:
      - project/baselines/specification.yaml

  - id: derive_architecture
    inputs:
      - project/spec/**
      - project/baselines/specification.yaml
      - project/engineering/**
      - project-pack/project.yaml
      - harness/policies/decision-policy.yaml
    prompt: harness/prompts/architecture-designer.md
    outputs:
      - project/architecture/**
      - project/evidence/bootstrap/architecture/**

  - id: validate_architecture
    validations:
      - architecture_traceability_complete
      - contracts_resolved_or_escalated
      - decision_policy_satisfied
      - conformance_checks_pass
    human_gate: architecture_baseline
    outputs:
      - project/baselines/architecture.yaml

  - id: derive_project_ai_policy
    inputs:
      - project/spec/**
      - project/architecture/**
      - harness/policies/**
    outputs:
      - project/ai/**

  - id: generate_work_items
    inputs:
      - project/spec/**
      - project/architecture/**
      - project/engineering/**
      - project/ai/**
      - project/baselines/specification.yaml
      - project/baselines/architecture.yaml
    prompt: harness/prompts/task-decomposer.md
    outputs:
      - project/work/tasks/**
      - project/work/execution-graph.yaml

  - id: validate_work_graph
    validations:
      - acceptance_criterion_coverage_100_percent
      - no_orphan_requirements
      - all_references_exist
      - dependency_graph_acyclic
      - repository_scopes_valid
      - no_unapproved_cross_context_tasks
      - all_tasks_independently_verifiable
      - human_gates_resolvable
    outputs:
      - project/evidence/bootstrap/work-validation/**

  - id: baseline_work
    human_gate: architecture_baseline
    outputs:
      - project/baselines/work.yaml
