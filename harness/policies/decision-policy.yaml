decision_policy:
  derivable_without_human_decision:
    - component_decomposition_within_approved_patterns
    - contract_documentation
    - dependency_mapping
    - test_scaffolding
    - repository_structure_from_template

  requires_human_decision:
    - new_architectural_pattern
    - technology_selection_or_change
    - trust_boundary_change
    - data_ownership_change
    - cross_domain_coupling
    - material_non_functional_tradeoff
    - security_exception
    - production_release

  behaviour_on_required_decision:
    action: stop_and_escalate
    record:
      - decision_required
      - affected_requirements
      - engineering_consequence
      - options_if_known
